Name: IndiaFOSS Chat (Preview)
Summary: Matrix messenger fork with conference handoff links and P2P mesh (preview)
Description: |-
  Preview build of IndiaFOSS Chat, an unofficial community fork of Element X
  Android (Neutrino), renamed and re-identified as org.indiafoss.chat. It is
  not produced or endorsed by Element or FOSS United and ships no Element
  branding. Element is a trademark of Element Creations Ltd.

  * Conference handoff links from the IndiaFOSS Companion open the normal user-profile and join screens; nothing is messaged or joined without a tap.
  * The offline-first Companion (schedule, ranking, itinerary, map, contact cards) is hosted inside the app.
  * End-to-end encryption on public Matrix homeservers via Element X.

  Known limitations of this preview: the embedded Neutrino peer-to-peer mesh
  is pre-alpha; installed-device interoperability, media and recovery still
  require acceptance evidence. Android 7.0 or later.
