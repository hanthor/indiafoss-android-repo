name: Validate real release APK
on:
  workflow_dispatch:
    inputs:
      promotion_record:
        description: Exact promotion record JSON (package, source, commit, release_id, asset_id, version_code, sha256)
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: 12266719
          packages: ''
      - name: Install pinned Android inspection tools
        run: sdkmanager 'build-tools;36.0.0' 'cmdline-tools;19.0'
      - name: Read the requested promotion record
        env:
          PROMOTION_RECORD: ${{ inputs.promotion_record }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads(os.environ['PROMOTION_RECORD'])
          Path('promotion.json').write_text(json.dumps(record))
          PY
      - name: Verify source CI, release ownership and actual signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python stage_release.py promotion.json --history history.json \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --apkanalyzer "$ANDROID_HOME/cmdline-tools/19.0/bin/apkanalyzer"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-input
          path: |
            staging/*.apk
            promotion.json
          if-no-files-found: error
          retention-days: 7
      - name: Install pinned fdroidserver
        run: |
          python -m pip install --require-hashes -r requirements-fdroidserver.txt
          fdroid --version
      - name: Generate and inspect an UNSIGNED preview catalogue from the staged APK
        # No index key is configured in CI: the index carries an ephemeral
        # placeholder key and is uploaded as an artifact only. Not deployed.
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          python build_catalogue.py --staging staging --history history.json \
            --record promotion.json --workdir build
          cd build && fdroid lint
      - name: Content checks of the unsigned preview (signature explicitly NOT verified)
        run: |
          python verify_index.py build/repo --history history.json --record promotion.json --expect-unsigned
      - name: Check no secrets or key material in the output
        run: |
          if find build/repo -name 'config.yml' -o -name '*.p12' -o -name '*.jks' -o -name '*.keystore' | grep .; then
            echo "Secret-looking files in catalogue output"; exit 1
          fi
          test ! -e build/repo/index-v1.jar
          test ! -e build/repo/entry.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-preview-catalogue
          path: build/repo
          if-no-files-found: error
          retention-days: 7
