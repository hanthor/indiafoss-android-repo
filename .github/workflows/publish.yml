name: Publish signed catalogue
# Fail-closed publication of the IndiaFOSS Preview F-Droid catalogue.
#
# Runs only by hand. It refuses to continue unless the three index signing
# secrets exist (none are created here) AND apps.json records the repository
# fingerprint AND the secret keystore actually holds the key with that
# fingerprint. It re-downloads and re-verifies every promoted APK from the
# immutable release assets in history.json, signs the index with the pinned
# fdroidserver, verifies the result with verify_index.py, and deploys only the
# generated public files to GitHub Pages under /fdroid/repo/. Nothing is ever
# committed: no config.yml, no keystore, no APK enters git.
#
# Secrets (repository or environment secrets; names only, documented in README):
#   FDROID_KEYSTORE_B64   base64 of the PKCS#12 keystore holding ONLY the index key
#   FDROID_KEYSTORE_PASS  keystore password (also used as the key password)
#   FDROID_KEY_ALIAS      alias of the index key inside that keystore
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Stop before deployment and upload the signed output as an artifact
        type: boolean
        default: true
      promotion_record:
        description: Optional exact promotion record JSON not yet in history.json
        required: false
        type: string
        default: ''
permissions: {}
concurrency:
  group: publish-catalogue
  cancel-in-progress: false
jobs:
  gate:
    # Everything below depends on this job. It has no write permissions.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the index signing secrets
        env:
          SIGNING_SECRETS_PRESENT: ${{ secrets.FDROID_KEYSTORE_B64 != '' && secrets.FDROID_KEYSTORE_PASS != '' && secrets.FDROID_KEY_ALIAS != '' }}
        run: |
          if [ "$SIGNING_SECRETS_PRESENT" != "true" ]; then
            echo "::error::FDROID_KEYSTORE_B64, FDROID_KEYSTORE_PASS and FDROID_KEY_ALIAS are not all configured. No index key has been provisioned; refusing to publish (fail closed)."
            exit 1
          fi
          echo "Index signing secrets are configured."
      - name: Require a recorded repository fingerprint
        run: |
          python3 - <<'PY'
          import json, re, sys
          fingerprint = json.load(open("apps.json")).get("repository", {}).get("fingerprint", "")
          if not re.fullmatch(r"[0-9a-f]{64}", fingerprint or ""):
              print("::error::apps.json repository.fingerprint is empty. Record the index key fingerprint first (README: key provisioning); refusing to publish.")
              sys.exit(1)
          print("Recorded fingerprint:", fingerprint)
          PY
      - name: Require the secret keystore to hold the recorded key
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          set -o pipefail
          keystore="$RUNNER_TEMP/index-key.p12"
          umask 077
          printf '%s' "$FDROID_KEYSTORE_B64" | base64 -d > "$keystore"
          keytool -exportcert -keystore "$keystore" -storetype PKCS12 -storepass:env FDROID_KEYSTORE_PASS \
            -alias "$FDROID_KEY_ALIAS" -file "$RUNNER_TEMP/index-key.der" > /dev/null
          actual="$(sha256sum "$RUNNER_TEMP/index-key.der" | cut -d' ' -f1)"
          recorded="$(python3 -c 'import json; print(json.load(open("apps.json"))["repository"]["fingerprint"])')"
          rm -f "$keystore" "$RUNNER_TEMP/index-key.der"
          if [ "$actual" != "$recorded" ]; then
            echo "::error::The keystore in FDROID_KEYSTORE_B64 holds fingerprint $actual, not the recorded $recorded. Refusing to publish."
            exit 1
          fi
          echo "Keystore fingerprint matches apps.json."

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: 12266719
          packages: ''
      - name: Install pinned Android tools and fdroidserver
        run: |
          sdkmanager 'build-tools;36.0.0' 'cmdline-tools;19.0'
          python -m pip install --require-hashes -r requirements-fdroidserver.txt
          fdroid --version
      - name: Run the policy tests before touching any release
        run: python -m unittest discover -s tests
      - name: Write the optional promotion record
        env:
          PROMOTION_RECORD: ${{ inputs.promotion_record }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ.get("PROMOTION_RECORD", "").strip()
          if raw:
              Path("promotion.json").write_text(json.dumps(json.loads(raw)))
              print("Extra promotion record written")
          else:
              print("No extra promotion record; publishing history.json only")
          PY
      - name: Re-download and verify every promoted APK from its immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          records = json.loads(Path("history.json").read_text())
          if Path("promotion.json").exists():
              records.append(json.loads(Path("promotion.json").read_text()))
          if not records:
              raise SystemExit("::error::history.json is empty and no record was given: nothing to publish")
          scratch = Path("records"); scratch.mkdir()
          home = os.environ["ANDROID_HOME"]
          for number, record in enumerate(records):
              path = scratch / f"{number}.json"
              path.write_text(json.dumps(record))
              subprocess.run(["python", "stage_release.py", str(path), "--history", "history.json",
                              "--destination", "staging",
                              "--apksigner", f"{home}/build-tools/36.0.0/apksigner",
                              "--apkanalyzer", f"{home}/cmdline-tools/19.0/bin/apkanalyzer"],
                             check=True)
          print(sorted(p.name for p in Path("staging").iterdir()))
          PY
      - name: Materialise the index key outside the checkout
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$FDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/index-key.p12"
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path("config.yml.example").read_text())
          temp = os.environ["RUNNER_TEMP"]
          config.update({
              "repo_keyalias": os.environ["FDROID_KEY_ALIAS"],
              "keystore": f"{temp}/index-key.p12",
              "keystorepass": os.environ["FDROID_KEYSTORE_PASS"],
              "keypass": os.environ["FDROID_KEYSTORE_PASS"],
          })
          target = Path(temp) / "config.yml"
          target.write_text(yaml.safe_dump(config))
          target.chmod(0o600)
          PY
      - name: Generate and sign the catalogue from the verified APKs
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          record_args=()
          if [ -f promotion.json ]; then record_args=(--record promotion.json); fi
          python build_catalogue.py --staging staging --history history.json "${record_args[@]}" \
            --workdir build --config "$RUNNER_TEMP/config.yml"
          (cd build && fdroid lint)
      - name: Destroy the key material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/index-key.p12" "$RUNNER_TEMP/config.yml" build/config.yml
          ! find . "$RUNNER_TEMP" \( -name '*.p12' -o -name '*.jks' -o -name '*.keystore' -o -name 'config.yml' \) -print | grep .
      - name: Verify the signed index against the recorded fingerprint
        run: |
          record_args=()
          if [ -f promotion.json ]; then record_args=(--record promotion.json); fi
          python verify_index.py build/repo --history history.json "${record_args[@]}"
      - name: Assemble the public site tree and verify it again
        run: |
          record_args=()
          if [ -f promotion.json ]; then record_args=(--record promotion.json); fi
          python publish_site.py build/repo site
          python verify_index.py site/fdroid/repo --history history.json "${record_args[@]}" --deployable
          find site -type f | sort
      - name: Upload the signed output (dry run only, not deployed)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-catalogue-dry-run
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload the Pages artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    # Only a non-dry run from main reaches GitHub Pages. Pages must be configured
    # with "GitHub Actions" as the source and a github-pages environment.
    needs: build
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write     # actions/deploy-pages publishes the uploaded artifact
      id-token: write  # OIDC token that deploy-pages presents to the Pages API
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}fdroid/repo/
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
